services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-tradinn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradinn_pass}
      POSTGRES_DB:       ${POSTGRES_DB:-tradinn_db}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradinn}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tradinn}:${POSTGRES_PASSWORD:-tradinn_pass}@db:5432/${POSTGRES_DB:-tradinn_db}
      JWT_SECRET:   ${JWT_SECRET:-cambiar_en_produccion}
      PORT:         3000
      NODE_ENV:     ${NODE_ENV:-production}
    networks:
      - backend_net
      - frontend_net
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend_net
    depends_on:
      - backend

volumes:
  db_data:

networks:
  backend_net:
    driver: bridge
    internal: true
  frontend_net:
    driver: bridge
